<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Nyann YT Music</title>

  <style>
    :root {
      --bg: #0a0c10;
      --card: #141820;
      --line: #243041;
      --text: #eef2f8;
      --muted: #8b9bb0;
      --accent: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          900px 480px at 80% -10%,
          #3a1520 0%,
          var(--bg) 55%
        );
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    h1 {
      font-size: 22px;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 16px;
    }

    .player-box {
      background: #000;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    .now {
      font-size: 14px;
      margin-bottom: 14px;
    }

    .now b {
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(150px, 1fr)
      );
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3a4a60;
    }

    .card.active {
      border-color: var(--accent);
      box-shadow:
        0 0 0 1px rgba(255, 77, 77, .4);
    }

    .cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .info {
      padding: 10px;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .artist {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    code {
      background: #1c2430;
      padding: 1px 6px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <h1>Nyann YT Music</h1>

    <div class="sub">
      Playlist trong file · ảnh bìa YouTube · lên GitHub là chạy
    </div>

    <div class="player-box" id="playerBox">
      <div class="placeholder">
        Chọn một bài bên dưới để phát
      </div>
    </div>

    <div class="now">
      Đang phát:
      <b id="now">—</b>
    </div>

    <div class="grid" id="grid"></div>

    <div class="hint">
      Sửa playlist trong file: mảng
      <code>SONGS</code> bên dưới.<br>
      Có thể dùng link YouTube đầy đủ hoặc chỉ ID video.
    </div>

  </div>


  <script>

    /* =========================================================
       PLAYLIST
       ========================================================= */

    var SONGS = [

      {
        title: "Gang Unit",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=DBhfYWOWR_k"
      },

      {
        title: "To The Max",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=4Mv--f1yfq8"
      },

      {
        title: "6Locc 6a6y (Remix)",
        artist: "Lil Loaded",
        url: "https://m.youtube.com/watch?v=aITIKxjFaL0&list=RDaITIKxjFaL0&start_radio=1&pp=oAcB"
      }

    ];


    /* =========================================================
       LẤY VIDEO ID
       ========================================================= */

    function extractId(urlOrId) {

      if (!urlOrId) return null;

      var s = String(urlOrId).trim();
      var m;

      /* YouTube watch URL */
      m = s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);

      if (m) {
        return m[1];
      }

      /* youtu.be */
      m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);

      if (m) {
        return m[1];
      }

      /* YouTube Shorts */
      m = s.match(
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/
      );

      if (m) {
        return m[1];
      }

      /* YouTube Embed */
      m = s.match(
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/
      );

      if (m) {
        return m[1];
      }

      /* Chỉ nhập ID */
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) {
        return s;
      }

      return null;
    }


    /* =========================================================
       ẢNH BÌA
       ========================================================= */

    function coverUrl(id) {

      return (
        "https://img.youtube.com/vi/" +
        id +
        "/hqdefault.jpg"
      );

    }


    /* =========================================================
       BIẾN
       ========================================================= */

    var current = -1;

    var grid =
      document.getElementById("grid");

    var playerBox =
      document.getElementById("playerBox");

    var nowEl =
      document.getElementById("now");


    /* =========================================================
       CHUẨN HÓA PLAYLIST
       ========================================================= */

    var list = [];

    for (
      var i = 0;
      i < SONGS.length;
      i++
    ) {

      var s = SONGS[i] || {};

      var id =
        extractId(
          s.url ||
          s.id ||
          s.link
        );

      if (!id) continue;

      list.push({

        id: id,

        title:
          s.title ||
          ("YouTube " + id),

        artist:
          s.artist || ""

      });

    }


    /* =========================================================
       PHÁT NHẠC
       ========================================================= */

    function playAt(index) {

      if (
        index < 0 ||
        index >= list.length
      ) {
        return;
      }

      current = index;

      var song = list[index];

      playerBox.innerHTML = "";

      var iframe =
        document.createElement("iframe");

      iframe.src =
        "https://www.youtube.com/embed/" +
        song.id +
        "?autoplay=1&rel=0";

      iframe.allow =
        "accelerometer; " +
        "autoplay; " +
        "clipboard-write; " +
        "encrypted-media; " +
        "gyroscope; " +
        "picture-in-picture; " +
        "web-share";

      iframe.allowFullscreen = true;

      playerBox.appendChild(iframe);

      nowEl.textContent =
        song.title +
        (
          song.artist
            ? " — " + song.artist
            : ""
        );

      render();

    }


    /* =========================================================
       HIỂN THỊ DANH SÁCH
       ========================================================= */

    function render() {

      grid.innerHTML = "";

      list.forEach(
        function(song, i) {

          var card =
            document.createElement("div");

          card.className =
            "card" +
            (
              i === current
                ? " active"
                : ""
            );

          card.innerHTML =
            '<img class="cover" alt="" loading="lazy">' +
            '<div class="info">' +
              '<div class="title"></div>' +
              '<div class="artist"></div>' +
            '</div>';

          var img =
            card.querySelector(".cover");

          img.src =
            coverUrl(song.id);

          /* Fallback ảnh */
          img.onerror =
            function() {

              img.src =
                "https://img.youtube.com/vi/" +
                song.id +
                "/mqdefault.jpg";

            };


          card.querySelector(
            ".title"
          ).textContent =
            song.title;


          card.querySelector(
            ".artist"
          ).textContent =
            song.artist ||
            song.id;


          card.onclick =
            function() {

              playAt(i);

            };


          grid.appendChild(card);

        }
      );

    }


    /* =========================================================
       KHỞI ĐỘNG
       ========================================================= */

    render();

    if (list.length === 0) {

      playerBox.innerHTML =
        '<div class="placeholder">' +
        'Playlist trống — thêm bài hát vào SONGS.' +
        '</div>';

    }

  </script>

</body>
</html>
